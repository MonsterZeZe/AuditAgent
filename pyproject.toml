[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-agent"
version = "0.1.0"
description = "审计领域智能 Agent 系统（LangChain + LangGraph + ChromaDB + Ollama）"
authors = [{ name = "MonsterZeZe" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/MonsterZeZe/auditllmforagent"
Repository = "https://github.com/MonsterZeZe/auditllmforagent"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langgraph>=0.2",
    "langchain-ollama>=0.1",
    "ollama>=0.3",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "typing-extensions>=4.9",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.9",
    "pylint>=3.1",
]

[tool.setuptools.packages.find]
include = ["app*", "graph*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
